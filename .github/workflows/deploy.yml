name: Deploy

# Builds the static landing site for the branch's environment:
#   develop -> dev  -> GitHub Pages at tsuru.jcampos.dev
#   main    -> prod -> S3 + CloudFront at www.tsuru.lat (apex redirects; cloudformation/hosting.yml)
# The dev-only admin CMS is tree-shaken out because VITE_ENABLE_ADMIN is left
# UNSET here (never set it to "true" in CI).

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Vite base path ("/" for the tsuru.jcampos.dev custom domain)'
        required: false
        default: '/'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served at the custom domain tsuru.jcampos.dev (root), set via public/CNAME
      # + repo Pages config. Overridable via workflow_dispatch input.
      BASE_PATH: ${{ github.event.inputs.base_path || '/' }}
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      # VITE_PUBLIC_API_URL / VITE_PUBLIC_IDENTITY_POOL_ID are set by the
      # "Resolve build configuration" steps (dev: repo variables, prod: SSM).
      # Public build params. Non-sensitive.
      VITE_API_URL: ${{ github.ref_name == 'main' && 'https://api.tsuru.lat' || secrets.VITE_API_URL }}
      VITE_APP_URL: ${{ github.ref_name == 'main' && 'https://app.tsuru.lat' || secrets.VITE_APP_URL }}
      VITE_BASE_DOMAIN: ${{ github.ref_name == 'main' && 'tsuru.lat' || secrets.VITE_BASE_DOMAIN }}
      VITE_SITE_URL: ${{ github.ref_name == 'main' && 'https://www.tsuru.lat' || 'https://tsuru.jcampos.dev' }}
      VITE_BLOG_SITE_URL: ${{ github.ref_name == 'main' && 'https://blogs.tsuru.lat' || 'https://blogs.tsuru.jcampos.dev' }}
      VITE_AWS_REGION: ${{ github.ref_name == 'main' && 'us-east-1' || secrets.VITE_AWS_REGION }}
      # Optional — only needed if the landing ever uses Cognito auth. Absent →
      # amplify.ts skips configure (see src/lib/amplify.ts).
      VITE_AWS_COGNITO_USER_POOL_ID: ${{ github.ref_name != 'main' && secrets.VITE_AWS_COGNITO_USER_POOL_ID || '' }}
      VITE_AWS_COGNITO_CLIENT_ID: ${{ github.ref_name != 'main' && secrets.VITE_AWS_COGNITO_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, prod only)
        if: env.ENVIRONMENT == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve build configuration from SSM (prod only)
        if: env.ENVIRONMENT == 'prod'
        run: bash scripts/load-env-from-ssm.sh prod - --github-env

      - name: Resolve build configuration from repo variables (dev only)
        if: env.ENVIRONMENT == 'dev'
        run: |
          echo "VITE_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_IDENTITY_POOL_ID=${{ vars.PUBLIC_IDENTITY_POOL_ID }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install static-rendering browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify types and SSM environment loader
        run: |
          pnpm check
          bash scripts/test-load-env-from-ssm.sh
          node --test scripts/tests/*.test.mjs

      - name: Build (admin tree-shaken; VITE_ENABLE_ADMIN unset)
        run: pnpm run build

      - name: Verify public code reads API content
        run: python3 scripts/check-public-imports.py

      - name: Verify admin + local-CMS are absent from the bundle
        run: |
          if grep -rl "__local" ../dist/landing/assets; then
            echo "::error::dev-CMS code leaked into the production bundle"; exit 1
          fi
          echo "ok: no /__local in dist"

      - name: Upload Pages artifact
        if: env.ENVIRONMENT == 'dev'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../dist/landing

      # prod: bucket and distribution are outputs of the tsuru-prod-landing-hosting
      # stack (SiteBucketName / SiteDistributionId), stored as repo variables.
      # Hashed assets are cached for a year; everything else revalidates.
      - name: Publish to S3 + invalidate CloudFront
        if: env.ENVIRONMENT == 'prod'
        run: |
          set -euo pipefail
          bucket="s3://${{ vars.PROD_SITE_BUCKET }}"
          aws s3 sync ../dist/landing "$bucket" --delete --exclude "assets/*" --cache-control "no-cache"
          aws s3 sync ../dist/landing/assets "$bucket/assets" --delete --cache-control "public,max-age=31536000,immutable"
          aws cloudfront create-invalidation --distribution-id "${{ vars.PROD_DISTRIBUTION_ID }}" --paths "/*" >/dev/null

  deploy:
    if: github.ref_name == 'develop'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
